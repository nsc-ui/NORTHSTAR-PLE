name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Entry checks
        run: python scripts/check_entry.py
      - name: Unit tests
        run: python tests_unit.py
      - name: Context tests
        run: python tests_context.py
      - name: Cancellation tests
        run: python tests_cancel.py
      - name: Mock smoke tests
        run: python tests_smoke.py

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag northstar-ple:ci .
